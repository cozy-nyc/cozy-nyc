name: Deploy dev (Cloudflare Pages)
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: deploy-dev
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @cozy/web build
        env:
          # Public URL of the dev API server (repo variable, not a secret).
          VITE_API_URL: ${{ vars.DEV_API_URL }}
      - run: pnpm --filter @cozy/web exec wrangler pages deploy dist --project-name cozy-nyc-dev --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
